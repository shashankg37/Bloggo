[project]
name = "blog-writing-agent"
version = "0.1.0"
description = "A LangGraph blog-writing agent: topic in, Markdown post out, with human Gates and durable Runs."
requires-python = ">=3.13"
dependencies = [
    "langgraph>=0.2",
    "langchain-groq>=0.2",
    "langchain-community>=0.3",
    "ddgs>=9.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    "langgraph-checkpoint-sqlite>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blog_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The langsmith pytest plugin imports `xxhash` at pytest startup, before the
# package's compat shim can install; the plugin is tracing-only and unused.
addopts = "-p no:langsmith_plugin"
